name: Installation verification

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published version restorable from NuGet.org without a leading v
        required: true
        default: 0.1.10

permissions:
  contents: read

jobs:
  sdk-unix:
    name: SDK install ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
          - runner: macos-15-intel
            rid: osx-x64
          - runner: macos-15
            rid: osx-arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview
      - name: Install and exercise released SDK
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          release_base="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
          curl --fail --location --silent --show-error \
            "$release_base/install-raven.sh" --output "$RUNNER_TEMP/install-raven.sh"
          export RAVEN_INSTALL_ROOT="$RUNNER_TEMP/raven"
          sh "$RUNNER_TEMP/install-raven.sh" "$VERSION"
          "$RAVEN_INSTALL_ROOT/bin/rvn" doctor
          output=$("$RAVEN_INSTALL_ROOT/bin/rvn" run samples/scripts/hello.rvn -- Raven)
          printf '%s\n' "$output"
          grep -F 'Hello from a single Raven file!' <<< "$output"
          grep -F 'Argument: Raven' <<< "$output"
          project_dir="$RUNNER_TEMP/raven-project"
          mkdir "$project_dir"
          (
            cd "$project_dir"
            "$RAVEN_INSTALL_ROOT/bin/rvn" init --name InstalledProject
            grep -F "<Project Sdk=\"Raven.Sdk/$VERSION\">" InstalledProject.rvnproj
            grep -F '<TargetFramework>net11.0</TargetFramework>' InstalledProject.rvnproj
            grep -F 'func Main()' src/Main.rvn
            dotnet build InstalledProject.rvnproj
            project_output=$(dotnet run --project InstalledProject.rvnproj)
            printf '%s\n' "$project_output"
            grep -F 'Hello from Raven' <<< "$project_output"
          )
          template_home="$RUNNER_TEMP/raven-template-home"
          template_packages="$RUNNER_TEMP/raven-template-packages"
          mkdir -p "$template_home" "$template_packages"
          DOTNET_CLI_HOME="$template_home" NUGET_PACKAGES="$template_packages" \
            dotnet new install "Raven.Templates@$VERSION"
          DOTNET_CLI_HOME="$template_home" NUGET_PACKAGES="$template_packages" \
            dotnet new raven-console --name DotnetTemplateProject --output "$RUNNER_TEMP/dotnet-template-project"
          test -f "$RUNNER_TEMP/dotnet-template-project/DotnetTemplateProject.rvnproj"
          grep -F "<Project Sdk=\"Raven.Sdk/$VERSION\">" "$RUNNER_TEMP/dotnet-template-project/DotnetTemplateProject.rvnproj"
          grep -F 'func Main()' "$RUNNER_TEMP/dotnet-template-project/src/Main.rvn"
          template_output=$(dotnet run --project "$RUNNER_TEMP/dotnet-template-project/DotnetTemplateProject.rvnproj")
          printf '%s\n' "$template_output"
          grep -F 'Hello from Raven' <<< "$template_output"
          dotnet publish "$RUNNER_TEMP/dotnet-template-project/DotnetTemplateProject.rvnproj" -c Release
          published_output=$(dotnet "$RUNNER_TEMP/dotnet-template-project/bin/Release/net11.0/publish/DotnetTemplateProject.dll")
          printf '%s\n' "$published_output"
          grep -F 'Hello from Raven' <<< "$published_output"
          DOTNET_CLI_HOME="$template_home" NUGET_PACKAGES="$template_packages" \
            dotnet new raven-classlib --name DotnetTemplateLibrary --output "$RUNNER_TEMP/dotnet-template-library"
          dotnet add "$RUNNER_TEMP/dotnet-template-project/DotnetTemplateProject.rvnproj" reference \
            "$RUNNER_TEMP/dotnet-template-library/DotnetTemplateLibrary.rvnproj"
          printf '%s\n' \
            'func Main() {' \
            '    System.Console.WriteLine(Greet())' \
            '}' \
            > "$RUNNER_TEMP/dotnet-template-project/src/Main.rvn"
          classlib_output=$(dotnet run --project "$RUNNER_TEMP/dotnet-template-project/DotnetTemplateProject.rvnproj")
          printf '%s\n' "$classlib_output"
          grep -F 'Hello from Raven' <<< "$classlib_output"
          dotnet publish "$RUNNER_TEMP/dotnet-template-project/DotnetTemplateProject.rvnproj" -c Release
          classlib_published_output=$(dotnet "$RUNNER_TEMP/dotnet-template-project/bin/Release/net11.0/publish/DotnetTemplateProject.dll")
          printf '%s\n' "$classlib_published_output"
          grep -F 'Hello from Raven' <<< "$classlib_published_output"
          DOTNET_CLI_HOME="$template_home" NUGET_PACKAGES="$template_packages" \
            dotnet new raven-web --name DotnetTemplateWeb --output "$RUNNER_TEMP/dotnet-template-web"
          dotnet build "$RUNNER_TEMP/dotnet-template-web/DotnetTemplateWeb.rvnproj"
          DOTNET_CLI_HOME="$template_home" NUGET_PACKAGES="$template_packages" \
            dotnet new raven-nano --name DotnetTemplateNano --output "$RUNNER_TEMP/dotnet-template-nano"

  sdk-windows:
    name: SDK install ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
          - runner: windows-11-arm
            rid: win-arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview
      - name: Install and exercise released SDK
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $releaseBase = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$env:VERSION"
          $installer = Join-Path $env:RUNNER_TEMP "install-raven.ps1"
          $installRoot = Join-Path $env:RUNNER_TEMP "raven"
          Invoke-WebRequest "$releaseBase/install-raven.ps1" -OutFile $installer
          & $installer -Version $env:VERSION -InstallRoot $installRoot
          & (Join-Path $installRoot "bin/rvn.cmd") doctor
          $output = & (Join-Path $installRoot "bin/rvn.cmd") run samples/scripts/hello.rvn -- Raven 2>&1 | Out-String
          Write-Output $output
          if ($output -notmatch [regex]::Escape("Hello from a single Raven file!") -or
              $output -notmatch [regex]::Escape("Argument: Raven")) {
            throw "The installed SDK did not run the expected Raven program."
          }
          $projectDirectory = Join-Path $env:RUNNER_TEMP "raven-project"
          New-Item -ItemType Directory -Path $projectDirectory | Out-Null
          Push-Location $projectDirectory
          try {
            $rvn = Join-Path $installRoot "bin/rvn.cmd"
            & $rvn init --name InstalledProject
            $projectText = Get-Content "InstalledProject.rvnproj" -Raw
            if ($projectText -notmatch [regex]::Escape("<Project Sdk=`"Raven.Sdk/$env:VERSION`">")) {
              throw "rvn init did not select the matching Raven.Sdk version."
            }
            if ($projectText -notmatch [regex]::Escape("<TargetFramework>net11.0</TargetFramework>")) {
              throw "rvn init did not write the expected target framework moniker."
            }
            $mainText = Get-Content "src/Main.rvn" -Raw
            if ($mainText -notmatch [regex]::Escape("func Main()")) {
              throw "rvn init did not create src/Main.rvn with an explicit Main function."
            }
            dotnet build InstalledProject.rvnproj
            $projectOutput = dotnet run --project InstalledProject.rvnproj 2>&1 | Out-String
            Write-Output $projectOutput
            if ($projectOutput -notmatch [regex]::Escape("Hello from Raven")) {
              throw "The installed SDK did not run the scaffolded Raven project."
            }
          }
          finally {
            Pop-Location
          }
          $templateHome = Join-Path $env:RUNNER_TEMP "raven-template-home"
          $templatePackages = Join-Path $env:RUNNER_TEMP "raven-template-packages"
          New-Item -ItemType Directory -Path $templateHome, $templatePackages | Out-Null
          $env:DOTNET_CLI_HOME = $templateHome
          $env:NUGET_PACKAGES = $templatePackages
          dotnet new install "Raven.Templates@$env:VERSION"
          $templateProject = Join-Path $env:RUNNER_TEMP "dotnet-template-project"
          dotnet new raven-console --name DotnetTemplateProject --output $templateProject
          if (-not (Test-Path (Join-Path $templateProject "DotnetTemplateProject.rvnproj"))) {
            throw "The published Raven.Templates package did not create the expected project."
          }
          $templateProjectText = Get-Content (Join-Path $templateProject "DotnetTemplateProject.rvnproj") -Raw
          if ($templateProjectText -notmatch [regex]::Escape("<Project Sdk=`"Raven.Sdk/$env:VERSION`">")) {
            throw "The published Raven template did not select the matching Raven.Sdk version."
          }
          $templateMain = Get-Content (Join-Path $templateProject "src/Main.rvn") -Raw
          if ($templateMain -notmatch [regex]::Escape("func Main()")) {
            throw "The published Raven console template did not contain an explicit Main function."
          }
          $templateOutput = dotnet run --project (Join-Path $templateProject "DotnetTemplateProject.rvnproj") 2>&1 | Out-String
          Write-Output $templateOutput
          if ($templateOutput -notmatch [regex]::Escape("Hello from Raven")) {
            throw "The published Raven template project did not run successfully through the .NET CLI."
          }
          $templateProjectFile = Join-Path $templateProject "DotnetTemplateProject.rvnproj"
          dotnet publish $templateProjectFile -c Release
          $publishedAssembly = Join-Path $templateProject "bin/Release/net11.0/publish/DotnetTemplateProject.dll"
          $publishedOutput = dotnet $publishedAssembly 2>&1 | Out-String
          Write-Output $publishedOutput
          if ($publishedOutput -notmatch [regex]::Escape("Hello from Raven")) {
            throw "The published Raven template output did not run successfully."
          }
          $templateLibrary = Join-Path $env:RUNNER_TEMP "dotnet-template-library"
          dotnet new raven-classlib --name DotnetTemplateLibrary --output $templateLibrary
          $templateLibraryProject = Join-Path $templateLibrary "DotnetTemplateLibrary.rvnproj"
          dotnet add $templateProjectFile reference $templateLibraryProject
          Set-Content (Join-Path $templateProject "src/Main.rvn") -Value @(
            "func Main() {",
            "    System.Console.WriteLine(Greet())",
            "}"
          )
          $classlibOutput = dotnet run --project $templateProjectFile 2>&1 | Out-String
          Write-Output $classlibOutput
          if ($classlibOutput -notmatch [regex]::Escape("Hello from Raven")) {
            throw "The released Raven SDK did not consume the generated Raven class library."
          }
          dotnet publish $templateProjectFile -c Release
          $classlibPublishedOutput = dotnet $publishedAssembly 2>&1 | Out-String
          Write-Output $classlibPublishedOutput
          if ($classlibPublishedOutput -notmatch [regex]::Escape("Hello from Raven")) {
            throw "The released Raven SDK did not publish an application with a Raven project reference."
          }
          $templateWeb = Join-Path $env:RUNNER_TEMP "dotnet-template-web"
          dotnet new raven-web --name DotnetTemplateWeb --output $templateWeb
          dotnet build (Join-Path $templateWeb "DotnetTemplateWeb.rvnproj")
          $templateNano = Join-Path $env:RUNNER_TEMP "dotnet-template-nano"
          dotnet new raven-nano --name DotnetTemplateNano --output $templateNano

  vscode:
    name: VSIX install ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x64
            archive: tar
            code_pattern: '[\\/]bin[\\/]code$'
          - runner: macos-15
            platform: darwin-arm64
            archive: zip
            code_pattern: 'Resources[\\/]app[\\/]bin[\\/]code$'
          - runner: windows-latest
            platform: win32-x64-archive
            archive: zip
            code_pattern: '[\\/]bin[\\/]code\.cmd$'
    steps:
      - name: Download, verify, and install released VSIX
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          VSCODE_PLATFORM: ${{ matrix.platform }}
          ARCHIVE_TYPE: ${{ matrix.archive }}
          CODE_PATTERN: ${{ matrix.code_pattern }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $releaseBase = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$env:VERSION"
          $vsix = Join-Path $env:RUNNER_TEMP "raven-vscode.vsix"
          $checksums = Join-Path $env:RUNNER_TEMP "SHA256SUMS"
          Invoke-WebRequest "$releaseBase/raven-vscode.vsix" -OutFile $vsix
          Invoke-WebRequest "$releaseBase/SHA256SUMS" -OutFile $checksums

          $checksumLine = Get-Content $checksums |
            Where-Object { $_ -match "\s\*?(?:\./)?raven-vscode\.vsix$" } |
            Select-Object -First 1
          if (-not $checksumLine) {
            throw "No checksum was published for raven-vscode.vsix."
          }
          $expected = ($checksumLine -split "\s+")[0].ToLowerInvariant()
          $actual = (Get-FileHash $vsix -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "VSIX checksum verification failed."
          }

          $vscodeRoot = Join-Path $env:RUNNER_TEMP "vscode"
          New-Item -ItemType Directory -Path $vscodeRoot | Out-Null
          if ($env:ARCHIVE_TYPE -eq "tar") {
            $archive = Join-Path $env:RUNNER_TEMP "vscode.tar.gz"
            Invoke-WebRequest "https://update.code.visualstudio.com/latest/$env:VSCODE_PLATFORM/stable" -OutFile $archive
            tar -xzf $archive -C $vscodeRoot
          }
          else {
            $archive = Join-Path $env:RUNNER_TEMP "vscode.zip"
            Invoke-WebRequest "https://update.code.visualstudio.com/latest/$env:VSCODE_PLATFORM/stable" -OutFile $archive
            if ($IsMacOS) {
              # Preserve the symlinks inside the macOS application bundle.
              # Expand-Archive materializes them as regular files, which makes
              # Electron's embedded frameworks invalid Mach-O binaries.
              ditto -x -k $archive $vscodeRoot
            }
            else {
              Expand-Archive $archive -DestinationPath $vscodeRoot
            }
          }

          $code = Get-ChildItem $vscodeRoot -Recurse -File |
            Where-Object { $_.FullName -match $env:CODE_PATTERN } |
            Select-Object -First 1
          if (-not $code) {
            throw "Could not locate the VS Code CLI."
          }
          if (-not $IsWindows) {
            chmod +x $code.FullName
          }

          $extensions = Join-Path $env:RUNNER_TEMP "extensions"
          $userData = Join-Path $env:RUNNER_TEMP "user-data"
          & $code.FullName --version
          & $code.FullName --install-extension $vsix --force --extensions-dir $extensions --user-data-dir $userData
          $installed = & $code.FullName --list-extensions --show-versions --extensions-dir $extensions --user-data-dir $userData
          Write-Output $installed
          if ($installed -notcontains "raven.raven-vscode@$env:VERSION") {
            throw "VS Code did not report the expected Raven extension version."
          }
