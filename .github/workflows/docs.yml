name: Raven website

on:
  pull_request:
    paths:
      - ".github/workflows/docs.yml"
      - ".config/dotnet-tools.json"
      - "docs/**"
      - "build/**"
      - "scripts/build-docs.sh"
      - "scripts/build-playground-site.sh"
      - "scripts/build-html-macro-site.sh"
      - "scripts/add-site-provenance.mjs"
      - "scripts/site-provenance-version.mjs"
      - "scripts/test-site-provenance-version.mjs"
      - "scripts/test-site-navigation.sh"
      - "scripts/test-docs-browser.mjs"
      - "scripts/add-production-analytics.sh"
      - "scripts/test-raven-highlighting-sync.mjs"
      - "scripts/codex-build.sh"
      - "src/Raven.CodeAnalysis/**"
      - "src/Raven.Compiler/**"
      - "src/Raven.Core/**"
      - "src/Raven.Macros/**"
      - "src/RavenDoc/**"
      - "src/Raven.Playground/**"
      - "src/Raven.Playground.Worker/**"
      - "samples/projects/macro-html-blazor/**"
      - "tools/**Generator/**"
  workflow_dispatch:
    inputs:
      documented_version:
        description: Raven version described by the site (defaults to global.json)
        required: false
        type: string
      publish_site:
        description: Publish the validated site to GitHub Pages
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            11.0.x
          dotnet-quality: preview

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/Raven.Playground/package-lock.json

      - name: Check Raven highlighting parity
        run: node scripts/test-raven-highlighting-sync.mjs

      - name: Build documentation
        run: scripts/build-docs.sh

      - name: Add playground
        run: scripts/build-playground-site.sh

      - name: Test published Playground in WebAssembly
        run: |
          src/Raven.Playground/node_modules/.bin/playwright install --with-deps chromium
          npm --prefix src/Raven.Playground run test:browser -- "$GITHUB_WORKSPACE/_site/playground"

      - name: Add experimental component-template showcase
        run: scripts/build-html-macro-site.sh

      - name: Add build provenance
        env:
          RAVEN_SITE_VERSION: ${{ inputs.documented_version }}
        run: |
          node scripts/test-site-provenance-version.mjs
          node scripts/add-site-provenance.mjs _site

      - name: Check site-root navigation
        run: scripts/test-site-navigation.sh

      - name: Check documentation in the browser
        run: node scripts/test-docs-browser.mjs _site

      - name: Add production analytics
        if: github.event_name == 'workflow_dispatch' && inputs.publish_site
        run: scripts/add-production-analytics.sh _site

      - name: Configure GitHub Pages
        if: github.event_name == 'workflow_dispatch' && inputs.publish_site
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'workflow_dispatch' && inputs.publish_site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_site
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v5
